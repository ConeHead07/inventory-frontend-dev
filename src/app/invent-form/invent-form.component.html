<div class="row mb-1">
  <div class="form-group col-4">
    <label for="kunde">KundeModel</label>
    <input id="kunde" class="form-control" [readOnly]="true" [attr.value]="kundeName">
  </div>
  <div class="form-group col-4">
    <label for="adresse">Adresse</label>
    <input id="adresse" class="form-control" [readOnly]="true" [attr.value]="adresse">
  </div>
  <div class="form-group col-4">
    <label for="raum">Raum</label>
    <input id="raum" class="form-control" [readOnly]="true" [attr.value]="raumNr">
  </div>
</div>

<div class="row mb-4">
  <div class="col-6">
    <app-progressbar [shortTitle]="'Gesamt'" [title]="'Fortschrittsanzeige gesamt'" [value]="45.5" [total]="145"></app-progressbar>
  </div>
  <div class="col-6">
    <app-progressbar [shortTitle]="'Raum'"  [title]="'Fortschrittsanzeige Raum'" [value]="45.5" [total]="145"></app-progressbar>
  </div>
</div>

<div class="form-group row mt-4">
  <label for="raumNr" class="col-4 col-sm-3 col-md-2 col-lg-2">Raum-Nr</label>
  <div class="col input-group">
    <input id="raumNr" type="text" class="form-control" placeholder="Raumnr" aria-label="Raumnummer">
    <div class="input-group-append">
      <button class="btn btn-outline-success" type="button">...</button>
    </div>
  </div>
</div>




<div class="form-group row">
    <label for="raumBez" class="col-4 col-sm-3 col-md-2 col-lg-2">Raum-Bez.</label>
    <div class="col">
      <input  id="raumBez" type="text" class="form-control">
    </div>
</div>

<div class="form-group row">
    <label for="elmBarcode" class="col-4 col-sm-3 col-md-2 col-lg-2">Barcode</label>
    <div class="col input-group">
      <input id="elmBarcode" readonly type="text" class="form-control" placeholder="Barcode" aria-label="Barcode">
      <div class="input-group-append">
        <button class="btn btn-outline-success" type="button">...</button>
      </div>
    </div>
</div>
<div class="form-group row">
  <label for="elmArtBez" class="col-4 col-sm-3 col-md-2 col-lg-2">Artike<span class="d-none d-md-inline">-Bez.</span></label>
    <div class="col input-group">
      <input id="elmArtBez" readonly type="text" class="form-control" placeholder="Artikelbezeichnung" aria-label="Artikelbezeichnung">
      <div class="input-group-append">
        <button class="btn btn-outline-success" type="button">...</button>
      </div>
    </div>
</div>
<div class="form-group row">
    <label for="elmArtTyp" class="col-3 col-sm-3 col-md-2 col-lg-2"><span class="d-none d-md-inline">Artikel-</span>Typ</label>
    <div class="col">
      <input  id="elmArtTyp" type="text" class="form-control">
    </div>
</div>

<div class="form-group row">
  <label for="elmArtTyp" class="col-3 col-sm-3 col-md-2 col-lg-2">Bild</label>
  <div class="col">
    <div class="btn-group btn-group-lg" role="group" aria-label="Large button group">
      <button type="button" class="btn btn-success"> + Neu</button>
      <button type="button" class="btn btn-info"> anzeigen</button>
    </div>
  </div>
</div>

<app-select-create-raum></app-select-create-raum>

<test></test>
