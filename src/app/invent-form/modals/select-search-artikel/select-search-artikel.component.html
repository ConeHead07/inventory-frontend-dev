<div class="modal-header p-0" style="padding:0.1rem">
  <div class="btn-group row no-gutters w-100">
  <button class="btn btn-primary col-10 text-left pl-3" (click)="showCreateForm($event)">
    <fa-icon [icon]="faPlus"></fa-icon> Neuen Artikel anlegen
  </button>
  <button type="button" class="btn btn-danger col-2" (click)="activeModal.dismiss('Cross click')">
    <span aria-hidden="true">&times;</span>
  </button>
  </div>
</div>
<div class="modal-header">
  <h4 class="modal-title">Artikelauswahl</h4>
</div>
<div class="modal-body">
  <label for="typeahead-prevent-manual-entry">Artikel suchen:</label>
  <input id="typeahead-prevent-manual-entry"  type="text" class="form-control"
         (selectItem)="onSelectItem($event)"
         [(ngModel)]="model"
         [ngbTypeahead]="search"
         [inputFormatter]="formatter"
         [resultFormatter]="formatter"
         [editable]='false' />
  <hr>
  <pre>Model: {{ model | json }}</pre>

  <p>select-search-artikel works! {{ clientId }}</p>
</div>
