<div class="modal-header p-0" style="padding:0.1rem">
  <div class="btn-group row no-gutters w-100">
    <button class="btn btn-primary col-10 text-left pl-3" (click)="showGesamtDoneForm()">
      <fa-icon [icon]="faSignOutAlt" class="mr-3"></fa-icon> Zeige bereits aufgenommene Räume
    </button>
    <button type="button" class="btn btn-danger col-2" (click)="activeModal.dismiss('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
</div>

<div class="modal-header">
  <h4 class="modal-title">Noch nicht inventarisiert ...</h4>
</div>
<div class="modal-body">

  <table class="table table-striped">
    <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col" sortable="Bezeichnung">Etage</th>
      <th scope="col" sortable="Typ">Raum</th>
      <th scope="col" sortable="Typ">Gestarted</th>
      <th scope="col" sortable="Menge">Vorher</th>
      <th scope="col" sortable="Menge">Nacher</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of raeumeListDone; let rowNr = index">
      <th scope="row">{{ rowNr + 1 }}</th>
      <th>{{ item.Etage }}</th>
      <td><span class="btn btn-link" (click)="onSelectRaum(item.uuid)">{{ item.Raum }}</span></td>
      <td>{{ item.editStatus === 0 ? 'Nein' : 'Ja' }}</td>
      <td>{{ item.total }}</td>
      <td>{{ item.done }}</td>
    </tr>
    </tbody>
  </table>
</div>
