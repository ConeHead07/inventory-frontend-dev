<div class="modal-header">
  <h4 class="modal-title">Raumfoto erstellen</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <!-- You can now use angular-cropper component in app.component.html -->
  <input style="display:none" type="file" accept="image/*" #inputUploadFile (change)="onInputImageFile($event, inputUploadFile)" />
  <input style="display:none" type="file"accept="image/*" #inputUploadImage capture="camera" (change)="onInputImageFile($event, inputUploadImage)" />
  <canvas id="prepareImgCanvas" #prepareImgCanvas style="display:none;"></canvas>

  <div class="editor" *ngIf="imageUrl">
    <div class="canvas">
      <angular-cropper
        #angularCropper
        *ngIf="imageUrl"
        [cropperOptions]="config"
        [imageUrl]="imageUrl">
      </angular-cropper>
      <!--
      (cropstart)="cropStart($event)"
      (crop)="onCrop($event)"
      (cropmove)="cropMove($event)"
      (cropend)="cropEnd($event)"
      (ready)="onCropperReady($event)"
      -->
    </div>


    <div class="toolbar-cropend" *ngIf="cropStatus === 5">
      <button class="btn btn-sm btn-success btn-icon-cirular" (click)="crop()"><fa-icon [icon]="faCheck"></fa-icon></button>
      <button class="btn btn-sm btn-danger btn-icon-cirular" (click)="cropReset()"><fa-icon [icon]="faBan"></fa-icon></button>
    </div>
    <div class="toolbar btn-group btn-group-sm rounded">
      <button class="btn btn-sm btn-light" (click)="setDragModeToMove()"><fa-icon [icon]="faMove"></fa-icon></button>
      <button class="btn btn-sm btn-light" (click)="setDragModeToCrop()"><fa-icon [icon]="faCrop"></fa-icon></button>
      <button class="btn btn-sm btn-light" (click)="zoomIn()"><fa-icon [icon]="faSearchPlus"></fa-icon></button>
      <button class="btn btn-sm btn-light" (click)="zoomOut()"><fa-icon [icon]="faSearchMinus"></fa-icon></button>
      <button class="btn btn-sm btn-light" (click)="rotateLeft()"><fa-icon [icon]="faRotateLeft"></fa-icon></button>
      <button class="btn btn-sm btn-light" (click)="rotateRight()"><fa-icon [icon]="faRotateRight"></fa-icon></button>
    </div>
  </div>
  <img *ngIf="previewImgUrl" [src]="previewImgUrl" class="mt-1" style="max-width:100%; max-height:150px;"/>
  <p class="d-none">create-raum-image works!</p>
</div>
<div class="modal-footer">
  <div class="btn-toolbar">
    <div class="btn-group mr-5">
      <button class="btn btn-info" (click)="openInputUploadFile()">
        <fa-icon [icon]="faUpload"></fa-icon>
        <span class="d-none d-md-inline"> Upload </span>
      </button>
      <button class="btn btn-info" (click)="openInputUploadImage()">
        <fa-icon [icon]="faCamera"></fa-icon>
        <span class="d-none d-md-inline"> Photo </span>
      </button>
    </div>
    <div class="btn-group">

      <button type="button" class="btn btn-secondary" (click)="close()">
        <fa-icon [icon]="faBan"></fa-icon>
        Abbr<span class="d-none d-md-inline">echen</span></button>
      <button type="button" class="btn btn-success" (click)="save()" *ngIf="imageUrl">
        <fa-icon [icon]="faSave"></fa-icon>
        <span class="d-none d-md-inline">Fertig</span></button>
    </div>
  </div>
</div>
