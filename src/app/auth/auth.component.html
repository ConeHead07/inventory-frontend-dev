<div class="bg"></div>
<div class="container h-100">
    <div class="d-flex justify-content-center h-100">
      <div>
        <h1>merTens Inventory</h1>
        <div class="user_card">

            <div class="d-flex justify-content-center">
              <h2>LOGIN</h2>
            </div>

            <div class="d-flex justify-content-center form_container">
                <form #loginForm=ngForm (ngSubmit)="onLoginSubmit()">
                    <div class="input-group mb-3">
                        <div class="input-group-append">
                            <span class="input-group-text">
                                <fa-icon [icon]="['fa', 'user']"></fa-icon>
                            </span>
                        </div>
                        <input type="text" class="form-control input_user" name="user" placeholder="username"
                            [(ngModel)]="form.email"
                            minlength="3"
                            pattern="[a-zA-Z0-9.@]{3,}"
                            required
                        >
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append">
                            <span class="input-group-text">
                                <fa-icon [icon]="['fa', 'key']"></fa-icon>
                            </span>
                        </div>
                        <input required type="password" class="form-control input_pass" name="password" placeholder="password"
                        [(ngModel)]="form.password"
                        required>
                    </div>
                    <div class="d-flex justify-content-center login_container">
                     <button type="button" name="button" class="btn login_btn"
                     (click)="onLoginSubmit()"
                     [disabled]="loginForm.invalid">Login</button>
                   </div>
                </form>
            </div>
        </div>
        <div *ngIf="error" class="alert alert-danger" style="max-width:90vw">{{ error }}</div>
      </div>
    </div>
</div>

<div style="display: none"><p>login works!</p></div>
